name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest

      - name: Ruff lint
        run: ruff check .

      - name: Compile Python files
        run: python -m compileall shionmusicbot scripts

      - name: Tests
        run: python -m pytest
